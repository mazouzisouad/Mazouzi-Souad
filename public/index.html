<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f8fe0">
<title>Code Ludique : entraînement au code de la route</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1f2a44; --muted:#6b7590; --line:#e6e1da;
  --bg:#f6f1ec; --card:#fffdfb;
  --green:#4aa03e; --green-d:#3b8531; --purple:#3d2bd0; --blue:#4a8be6; --red:#d93a2f;
  --sig:#fde6dc; --reg:#e2e9f4; --cond:#e8e2f6; --veh:#fcefc2;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);background:linear-gradient(180deg,#f4efe9,#eaeff7);min-height:100vh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:104px;background:var(--bg)}
.app.noNav{padding-bottom:40px}

/* hero */
.hero{position:relative;height:236px;overflow:hidden;color:#fff;padding:54px 20px 0;background:linear-gradient(180deg,#4a86dd 0%,#76b0ee 62%,#a8d3f4 100%)}
.hero .cloud{position:absolute;background:rgba(255,255,255,.55);border-radius:40px}
.hero .hills{position:absolute;left:0;right:0;bottom:0;width:100%;height:70px}
.hero .sub{font-size:15px;font-weight:600;opacity:.95;line-height:1.35;max-width:55%}
.hero h1{margin:0;font-size:34px;font-weight:900;letter-spacing:-.5px;line-height:1.05}
.hero .lab{font-size:17px;font-weight:700}
.hero .big{font-size:58px;font-weight:900;line-height:1;letter-spacing:-1.5px;margin:4px 0 10px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#dff3d4;color:#2f6b25;font-weight:800;font-size:13px;padding:7px 12px;border-radius:999px}
.mascot{position:absolute;right:6px;bottom:4px;width:52%;max-width:240px}
.bubble{position:absolute;right:18px;top:44px;background:#ffe27a;color:#4a3a08;font-weight:800;font-size:13px;line-height:1.15;text-align:center;padding:8px 12px;border-radius:16px;max-width:112px;z-index:2;transform:rotate(3deg)}
.sheet{position:relative;margin-top:-26px;background:var(--bg);border-radius:26px 26px 0 0;padding:16px 14px 6px}

/* cards */
.card{background:var(--card);border-radius:22px;padding:14px;box-shadow:0 4px 18px rgba(60,50,40,.07);border:1px solid rgba(0,0,0,.03);margin-bottom:14px}
.ctitle{display:flex;align-items:center;gap:8px;font-weight:900;font-size:17px;margin-bottom:10px}
.ctitle svg{width:22px;height:22px;flex:none}
.ctitle .date{margin-left:auto;font-size:12px;font-weight:700;color:#4aa03e}
.row{display:flex;align-items:center;gap:12px}
.inner{background:#fff;border-radius:16px;padding:12px;border:1px solid var(--line)}
.sec{display:flex;align-items:center;justify-content:space-between;margin:6px 4px 10px}
.sec h2{margin:0;font-size:20px;font-weight:900}
.link{color:#4a5bd6;font-weight:800;font-size:13px}
.muted{color:var(--muted);font-size:13px;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:900;border-radius:999px;padding:12px 20px;font-size:15px;color:#fff}
.btn.green{background:var(--green);box-shadow:0 3px 0 var(--green-d)}
.btn.purple{background:var(--purple);box-shadow:0 3px 0 #2a1d9a}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.sm{padding:9px 16px;font-size:14px}
.btn.full{width:100%}
.btn:disabled{opacity:.45;box-shadow:none;cursor:default}
.btn svg{width:14px;height:14px}

/* ring */
.ring{position:relative;width:58px;height:58px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900}
.bar{height:8px;border-radius:99px;background:#ece7e1;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--green)}

/* category tiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tiles.two{grid-template-columns:1fr 1fr;gap:10px}
.tile{border-radius:18px;padding:12px 8px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:118px;justify-content:space-between;position:relative}
.tile svg.ic{width:44px;height:44px}
.tile .nm{font-weight:900;font-size:12.5px;line-height:1.15}
.tile .pc{font-weight:900;font-size:11px;align-self:flex-start}
.tile .bar{width:100%;height:5px}
.tile.wide{flex-direction:row;text-align:left;justify-content:flex-start;padding:12px;gap:10px;min-height:0}
.tile.wide .nm{font-size:14px}
.tile.wide .ct{font-size:12.5px;font-weight:700;color:var(--muted)}
.tile.wide .chev{margin-left:auto;color:var(--muted);width:14px;height:14px}
.tile.on{outline:3px solid #4a5bd6}
.t-sig{background:var(--sig)} .t-reg{background:var(--reg)} .t-cond{background:var(--cond)} .t-veh{background:var(--veh)}

/* highlight cards */
.daily{background:linear-gradient(135deg,#e9e5fb,#f3efff);border-radius:22px;padding:14px;margin-bottom:14px;display:flex;gap:12px;align-items:center}
.daily .tx{flex:1}
.daily .kick{display:flex;align-items:center;gap:6px;color:#4a3bc4;font-weight:900;font-size:13px}
.daily h3{margin:6px 0 10px;font-size:16px;line-height:1.25;font-weight:900}
.daily .pic{width:104px;height:104px;border-radius:16px;background:linear-gradient(180deg,#bfe0ff,#e6f4d8);display:flex;align-items:center;justify-content:center;flex:none}
.daily .pic svg{width:64px;height:64px}
.note{display:flex;align-items:center;gap:12px;background:#fff8e6;border-radius:18px;padding:12px 14px;margin-bottom:14px}
.note svg{width:36px;height:36px;flex:none}
.note b{display:block;font-weight:900;font-size:15px}
.note span{font-size:13px;font-weight:600;color:var(--muted)}
.exam{display:flex;gap:6px;align-items:flex-end;background:linear-gradient(135deg,#e5f4ea,#eef7e6);border-radius:22px;padding:14px 8px 14px 14px;margin-bottom:14px;overflow:hidden}
.exam .tx{flex:1;padding-bottom:2px}
.exam h3{margin:4px 0 6px;font-size:17px;line-height:1.2;font-weight:900}
.exam svg.m{width:44%;max-width:160px;flex:none;margin-bottom:-6px}

/* lists */
.item{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item .ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.item .ico svg{width:26px;height:26px}
.item .tt{font-weight:900;font-size:14.5px;line-height:1.2}
.item .ss{font-size:12.5px;font-weight:600;color:var(--muted);margin-top:2px}
.item .dt{margin-left:auto;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.barrow{display:flex;align-items:center;gap:12px;padding:8px 0}
.barrow .ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.barrow .ico svg{width:26px;height:26px}
.barrow .mid{flex:1}
.barrow .mid b{display:block;font-weight:900;font-size:14.5px;margin-bottom:5px}
.barrow .pc{font-weight:900;font-size:14px;width:40px;text-align:right}
.empty{padding:14px 6px;text-align:center;color:var(--muted);font-weight:700;font-size:14px}

/* nav */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:max(10px,env(safe-area-inset-bottom));width:calc(100% - 24px);max-width:456px;background:#fff;border-radius:26px;padding:8px;display:flex;gap:4px;box-shadow:0 8px 28px rgba(40,50,80,.18);z-index:20}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:20px;font-size:11.5px;font-weight:800;color:#8a93aa}
.nav button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{background:#e6efff;color:#2f6fd6}

/* quiz */
.qwrap{padding:16px 14px 0}
.qtop{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.qtop .x{width:38px;height:38px;border-radius:50%;background:#fff;border:2px solid var(--line);font-size:22px;line-height:1;font-weight:700;color:var(--muted)}
.qbar{flex:1;height:12px;border-radius:99px;background:#e5dfd8;overflow:hidden}
.qbar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .3s}
.qtop .cnt{font-weight:900;font-size:14px;color:var(--muted);min-width:42px;text-align:right}
.qcard{background:#fff;border-radius:22px;padding:18px;box-shadow:0 4px 18px rgba(60,50,40,.07);margin-bottom:14px}
.qtheme{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:900;padding:5px 10px;border-radius:99px;margin-bottom:10px}
.qtheme svg{width:16px;height:16px}
.qcard h2{margin:0;font-size:20px;line-height:1.3;font-weight:900}
.opts{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:18px;padding:13px 14px;font-weight:700;font-size:15.5px;line-height:1.3;box-shadow:0 2px 0 var(--line)}
.opt b{width:30px;height:30px;border-radius:50%;background:#eef1f7;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;flex:none}
.opt.sel{border-color:#4a8be6;background:#eaf2ff;box-shadow:0 2px 0 #4a8be6}
.opt.sel b{background:#4a8be6;color:#fff}
.opt.ok{border-color:var(--green);background:#e7f5e2;box-shadow:0 2px 0 var(--green)}
.opt.ok b{background:var(--green);color:#fff}
.opt.ko{border-color:var(--red);background:#fdeceb;box-shadow:0 2px 0 var(--red)}
.opt.ko b{background:var(--red);color:#fff}
.opt.dim{opacity:.55}
.fb{border-radius:18px;padding:14px;margin-bottom:14px;font-weight:600;font-size:14.5px;line-height:1.4}
.fb b{display:block;font-size:16px;font-weight:900;margin-bottom:4px}
.fb.ok{background:#e7f5e2;color:#25601d}
.fb.ko{background:#fdeceb;color:#8f241d}

/* result + fiche */
.revi{border-top:1px solid var(--line);padding:12px 2px}
.revi:first-child{border-top:0}
.revi .qq{font-weight:900;font-size:14.5px;line-height:1.3;margin-bottom:6px}
.revi .you{font-size:13px;font-weight:700;color:var(--red);margin-bottom:3px}
.revi .good{font-size:13px;font-weight:700;color:#2f7a25;margin-bottom:3px}
.revi .why{font-size:13px;font-weight:600;color:var(--muted);line-height:1.4}
.back{display:inline-flex;align-items:center;gap:6px;color:#fff;font-weight:900;font-size:14px;margin-bottom:12px}
.back svg{width:16px;height:16px}
.fiche ul{margin:0;padding-left:0;list-style:none}
.fiche li{position:relative;padding:10px 0 10px 28px;border-bottom:1px solid var(--line);font-weight:600;font-size:15px;line-height:1.45}
.fiche li:last-child{border-bottom:0}
.fiche li:before{content:"";position:absolute;left:4px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--green)}
.tag{display:inline-block;font-size:11.5px;font-weight:900;padding:4px 10px;border-radius:99px;margin-bottom:8px}
.read{font-size:11px;font-weight:900;color:#2f7a25;background:#e1f3dc;border-radius:99px;padding:3px 8px;margin-left:8px}
.foot{text-align:center;color:var(--muted);font-size:11.5px;font-weight:600;padding:8px 20px 4px;line-height:1.4}

.lockb{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:900;background:#fff3c4;color:#7a5a00;border-radius:99px;padding:3px 8px}
.promo{background:linear-gradient(135deg,#3d2bd0,#6a4bd0);color:#fff;border-radius:22px;padding:16px;margin-bottom:14px}
.promo h3{margin:0 0 4px;font-size:18px;font-weight:900}
.promo p{margin:0 0 12px;font-size:13.5px;font-weight:600;opacity:.92;line-height:1.4}
.promo .btn{background:#fff;color:#3d2bd0;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.price{font-size:34px;font-weight:900;letter-spacing:-1px}
.price small{font-size:14px;font-weight:700;color:var(--muted);letter-spacing:0}
.perks{list-style:none;margin:12px 0 4px;padding:0}
.perks li{padding:7px 0 7px 30px;position:relative;font-weight:700;font-size:14.5px}
.perks li:before{content:"✓";position:absolute;left:0;top:6px;width:21px;height:21px;border-radius:50%;background:var(--green);color:#fff;font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center}
.inp{width:100%;font:inherit;font-weight:800;font-size:16px;letter-spacing:1px;text-transform:uppercase;border:2px solid var(--line);border-radius:16px;padding:13px 14px;background:#fff;color:var(--ink);margin-bottom:10px}
.inp:focus{outline:none;border-color:#4a8be6}
.msg{font-size:13.5px;font-weight:800;margin:-2px 0 10px}
.msg.ko{color:var(--red)} .msg.ok{color:#2f7a25}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="sloth" viewBox="0 0 140 130">
      <circle cx="18" cy="52" r="12" fill="#7a4f30"/><circle cx="122" cy="52" r="12" fill="#7a4f30"/>

      <circle cx="37" cy="90" r="6" fill="#f2a08e" opacity=".5"/><circle cx="103" cy="90" r="6" fill="#f2a08e" opacity=".5"/>
      <path d="M17 58 Q70 -16 123 58 Q70 42 17 58Z" fill="#2f6fd6"/>
      <ellipse cx="70" cy="30" rx="17" ry="11" fill="#fff"/>
      <path d="M26 55 Q70 74 116 55 Q104 48 70 48 Q38 48 26 55Z" fill="#1f56b8"/>

      <path d="M52 62 Q62 12 108 12 L142 12 Q182 12 192 62Z" fill="#5a9bf0"/>
      <rect x="10" y="56" width="220" height="40" rx="20" fill="#3d78d8"/>

<div id="app" class="app"></div>

<script>
var Q = [
    // Priorités
    {t:'Priorités', q:'À une intersection sans panneau ni feu, qui est prioritaire ?', o:['Le véhicule qui vient de votre droite','Le véhicule qui vient de votre gauche','Le véhicule le plus rapide','Le véhicule le plus gros'], e:'En l’absence de signalisation, on applique la priorité à droite.'},
    {t:'Priorités', q:'Vous arrivez devant un panneau STOP et la voie semble libre. Que faites-vous ?', o:['Vous vous arrêtez complètement, puis vous regardez','Vous ralentissez seulement','Vous vous arrêtez uniquement si un véhicule arrive','Vous klaxonnez avant de passer'], e:'Le STOP impose un arrêt complet, même si personne n’arrive.'},
    {t:'Priorités', q:'À l’entrée d’un carrefour à sens giratoire signalé par un panneau « cédez le passage », qui passe en premier ?', o:['Les véhicules déjà engagés sur l’anneau','Les véhicules qui veulent y entrer','Les véhicules qui arrivent sur votre droite à l’entrée','Le véhicule le plus rapide'], e:'Vous cédez le passage aux véhicules déjà engagés sur l’anneau (article R415-10 du Code de la route).'},
    {t:'Priorités', q:'Un véhicule de secours avec sirène et gyrophare arrive derrière vous. Que faites-vous ?', o:['Vous vous rangez dès que possible pour le laisser passer','Vous accélérez pour dégager la route','Vous freinez et vous vous arrêtez au milieu de la voie','Vous continuez normalement'], e:'Vous facilitez son passage en vous rangeant sans prendre de risque.'},
    {t:'Priorités', q:'Un piéton s’engage sur un passage protégé devant vous. Que devez-vous faire ?', o:['Lui céder le passage','Klaxonner pour qu’il se dépêche','Passer devant lui s’il marche lentement','Accélérer pour passer avant lui'], e:'Le piéton engagé sur un passage protégé est prioritaire.'},
    {t:'Priorités', q:'Le feu passe à l’orange fixe alors que vous approchez. Que faites-vous ?', o:['Vous vous arrêtez, sauf si l’arrêt est trop brusque pour être sûr','Vous accélérez systématiquement','Vous passez toujours, car l’orange est tolérée','Vous freinez à fond dans tous les cas'], e:'L’orange fixe annonce le rouge : il faut s’arrêter, sauf si l’arrêt ne peut se faire dans de bonnes conditions de sécurité.'},
    {t:'Priorités', q:'Un véhicule d’intervention avec gyrophare bleu et sirène à deux tons arrive à un carrefour où vous avez le feu vert. Que faites-vous ?', o:['Vous lui cédez le passage sans mettre personne en danger','Vous passez, car vous avez le feu vert','Vous accélérez pour libérer le carrefour avant lui','Vous klaxonnez pour le prévenir'], e:'Un véhicule prioritaire en intervention bénéficie de la priorité, même si le feu est vert pour vous. Cédez-lui le passage en restant prudent.'},
    {t:'Priorités', q:'Un véhicule a un gyrophare bleu et une sirène à trois tons. Que devez-vous faire ?', o:['Faciliter son passage, sans qu’il soit prioritaire aux intersections','Lui céder la priorité à tous les carrefours, comme à un véhicule des pompiers','L’ignorer, car il n’a aucun droit particulier','Passer avant lui dans tous les cas'], e:'Avec une sirène à trois tons, le véhicule bénéficie de facilités de passage : vous l’aidez à passer, mais il doit respecter la signalisation et les priorités.'},
    // Vitesse et distances
    {t:'Vitesse et distances', q:'Sauf indication contraire, quelle est la vitesse maximale en agglomération ?', o:['50 km/h','30 km/h','60 km/h','70 km/h'], e:'La limite générale en agglomération est de 50 km/h.'},
    {t:'Vitesse et distances', q:'Sauf indication contraire, quelle est la vitesse maximale sur une route à double sens sans séparateur central, hors agglomération ?', o:['80 km/h','70 km/h','90 km/h','100 km/h'], e:'Sur ces routes, la limite générale est de 80 km/h.'},
    {t:'Vitesse et distances', q:'Par temps de pluie, quelle est la vitesse maximale sur autoroute pour un conducteur confirmé ?', o:['110 km/h','90 km/h','100 km/h','130 km/h'], e:'La limite est de 130 km/h par temps sec et de 110 km/h par temps de pluie. Un jeune conducteur reste limité à 110 km/h dans tous les cas.'},
    {t:'Vitesse et distances', q:'Quelle est la distance de sécurité minimale avec le véhicule qui vous précède ?', o:['Un intervalle d’au moins 2 secondes','Un intervalle d’une demi-seconde','La longueur d’une voiture','Environ 5 mètres, quelle que soit la vitesse'], e:'Gardez au moins 2 secondes d’écart. Il faut l’augmenter quand la route est mouillée.'},
    {t:'Vitesse et distances', q:'La distance d’arrêt est égale à…', o:['la distance de réaction plus la distance de freinage','la distance de freinage seulement','la distance de réaction seulement','la distance de sécurité'], e:'Pendant le temps de réaction, le véhicule roule encore avant même que le freinage commence.'},
    {t:'Vitesse et distances', q:'Sur chaussée mouillée, la distance de freinage…', o:['augmente nettement','reste la même','diminue légèrement','diminue beaucoup'], e:'L’adhérence est moins bonne, il faut freiner plus tôt et rouler moins vite.'},
    {t:'Vitesse et distances', q:'Votre véhicule commence à aquaplaner. Que faites-vous ?', o:['Vous relâchez progressivement l’accélérateur et tenez fermement le volant','Vous freinez très fort','Vous donnez un coup de volant brusque','Vous accélérez pour retrouver de l’adhérence'], e:'Évitez tout geste brusque : ralentissez progressivement jusqu’à ce que les pneus retrouvent le contact avec la route.'},
    {t:'Vitesse et distances', q:'Le brouillard réduit la visibilité à moins de 50 mètres. Quelle est la vitesse maximale sur tous types de route ?', o:['50 km/h','30 km/h','70 km/h','80 km/h'], e:'Quand la visibilité est inférieure à 50 mètres, la vitesse est limitée à 50 km/h sur toutes les routes.'},

function loadStore(){

  try { var raw = localStorage.getItem(KEY); if(raw) s = JSON.parse(raw); } catch(e){}
  if(!s) s = mem;
  s = s || {};
  s.ans = s.ans || {}; s.log = s.log || []; s.done = s.done || []; s.read = s.read || {};
  if(s.best === undefined) s.best = null;
  if(s.resume === undefined) s.resume = null;
  if(s.prem === undefined) s.prem = null;
  return s;
}

function shuffle(a){ a = a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function mastery(ids){ var n=0; ids.forEach(function(i){ if(store.ans[i] && store.ans[i].ok) n++; }); return ids.length ? Math.round(100*n/ids.length) : 0; }
function rate(){
  var L = store.log.slice(-60);
  if(!L.length) return null;
  return Math.round(100*L.filter(function(x){ return x.ok; }).length/L.length);
}
function weekDelta(){
  var lim = Date.now()-7*864e5;
  var wk = store.log.filter(function(x){ return x.ts>=lim; });
  var pv = store.log.filter(function(x){ return x.ts<lim; }).slice(-60);
  if(wk.length<5 || pv.length<5) return null;
  var a = wk.filter(function(x){ return x.ok; }).length/wk.length;
  var b = pv.filter(function(x){ return x.ok; }).length/pv.length;
  return Math.round(100*(a-b));
}
function doneSince(ms){ return store.done.filter(function(t){ return t>=ms; }).length; }
function doneToday(){ var d = new Date().toDateString(); return store.done.filter(function(t){ return new Date(t).toDateString()===d; }).length; }
function dayIdx(){ return Math.floor((Date.now()+36e5)/864e5); }
function frDate(){ var s = new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}); return s.charAt(0).toUpperCase()+s.slice(1); }
function shortDate(ts){ return new Date(ts).toLocaleDateString('fr-FR',{day:'numeric',month:'short'}); }
function cut(s,n){ return s.length>n ? s.slice(0,n-1).replace(/\s+\S*$/,'')+'…' : s; }
function ring(frac, label){
  var r=24, c=2*Math.PI*r, f=Math.max(0,Math.min(1,frac));
  return '<div class="ring"><svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="'+r+'" fill="none" stroke="#e7e2db" stroke-width="6"/><circle cx="30" cy="30" r="'+r+'" fill="none" stroke="#4aa03e" stroke-width="6" stroke-linecap="round" stroke-dasharray="'+(c*f).toFixed(1)+' '+c.toFixed(1)+'"/></svg><b>'+label+'</b></div>';
}

    if(!e.ok && store.ans[e.id] && !store.ans[e.id].ok) wrong.push(e);
  }
  html += '<div class="card"><div class="ctitle"><span style="width:22px;height:22px;border-radius:50%;background:#6a4bd0;color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center;font-weight:900">!</span>Tes erreurs récentes'+(wrong.length?'<button class="link" style="margin-left:auto" data-a="errors">Revoir ›</button>':'')+'</div>';
  if(!wrong.length){ html += '<div class="empty">Aucune erreur à revoir pour l’instant.</div>'; }
  wrong.forEach(function(e){
    var c = catOf(e.id);
    html += '<button class="item" data-a="errors"><span class="ico '+c.cls+'">'+icon(c)+'</span><span><div class="tt">'+cut(Q[e.id].q,62)+'</div><div class="ss">Bonne réponse : '+cut(Q[e.id].o[0],54)+'</div></span><span class="dt">'+shortDate(e.ts)+'</span></button>';
  });
  html += '</div>';
  var wk = doneSince(Date.now()-7*864e5);
  html += '<div class="note">'+I_TROPHY+'<div><b>'+(seen?'Bravo !':'À toi de jouer !')+'</b><span>'+(wk?('Tu as validé '+wk+' série'+(wk>1?'s':'')+' cette semaine'):'Tes progrès apparaîtront ici')+'</span></div></div>';
  return html+'</div>';
}

function vCours(){
  var read = FICHES.filter(function(f){ return store.read[f.id]; }).length;
  var p = Math.round(100*read/FICHES.length);
  var h = hero('<h1 style="font-size:28px">Apprends le code<br>à ton rythme !</h1><div class="sub" style="margin-top:8px;font-size:13.5px">Des fiches claires pour bien comprendre.</div>','book','Petit à petit, tu y es !');
  var html = h+'<div class="sheet">';
  html += '<div class="card"><div class="ctitle">'+I_BOOK+'Ta progression dans les cours</div><div class="row"><div class="bar" style="flex:1;height:10px"><i style="width:'+p+'%"></i></div><b style="color:#2f7a25">'+p+'%</b></div><div class="muted" style="margin-top:6px">'+read+' fiche'+(read>1?'s':'')+' sur '+FICHES.length+' lue'+(read>1?'s':'')+'</div></div>';
  html += '<div class="sec"><h2>Les grands chapitres</h2>'+(coursCat?'<button class="link" data-a="filter" data-c="">Tout afficher</button>':'')+'</div><div class="tiles two" style="margin-bottom:14px">';
  CAT.forEach(function(c){
    var fl = fichesOf(c.id), rd = fl.filter(function(f){ return store.read[f.id]; }).length;
    html += '<button class="tile wide '+c.cls+(coursCat===c.id?' on':'')+'" data-a="filter" data-c="'+c.id+'">'+icon(c)+'<span style="flex:1"><span class="nm" style="display:block">'+c.name+'</span><span class="ct">'+fl.length+' fiches</span><span class="bar" style="display:block;margin-top:6px;height:5px"><i style="width:'+Math.round(100*rd/fl.length)+'%;background:'+c.bar+'"></i></span></span></button>';
  });
  html += '</div>';
  var fd = FICHES[dayIdx() % FICHES.length];
  html += '<div class="daily"><div class="tx"><div class="kick">'+I_STAR+' Ta fiche du jour</div><h3>'+fd.t+'</h3><div class="muted" style="margin:-4px 0 10px">'+I_CLOCK+' ~'+fd.min+' min de lecture</div><button class="btn purple sm" data-a="fiche" data-f="'+fd.id+'">Lire la fiche '+CHEV+'</button></div><div class="pic">'+icon(catById(fd.c))+'</div></div>';
  html += '<div class="sec"><h2>'+(coursCat?catById(coursCat).name:'Toutes les fiches')+'</h2></div><div class="card" style="padding:6px 12px">';
  FICHES.filter(function(f){ return !coursCat || f.c===coursCat; }).forEach(function(f){
    var c = catById(f.c);
    html += '<button class="item" data-a="fiche" data-f="'+f.id+'"><span class="ico '+c.cls+'">'+icon(c)+'</span><span><div class="tt">'+f.t+(store.read[f.id]?'<span class="read">Lue</span>':'')+((!isPrem() && !FREE_FICHES[f.id])?'<span class="lockb" style="margin-left:8px">'+I_LOCK+' Premium</span>':'')+'</div><div class="ss">'+I_CLOCK+' ~'+f.min+' min</div></span><span class="dt" style="width:14px">'+CHEV+'</span></button>';
  });
  html += '</div>';
  html += '<div class="note">'+I_BULB+'<div><b>Bon à savoir !</b><span>Sur route sèche, la distance de sécurité est d’au moins 2 secondes.</span></div></div>';
  return html+'</div>';
}

function vFiche(){
  var f = FICHES.filter(function(x){ return x.id===ficheId; })[0], c = catById(f.c);
  var html = '<div class="hero" style="height:150px;padding-top:50px">'+hills()+'<button class="back" data-a="tab" data-t="cours">'+BACK+' Cours</button><h1 style="font-size:26px;max-width:64%">'+f.t+'</h1>'+mascot('book','mascot')+'</div><div class="sheet fiche">';
  html += '<div class="card"><span class="tag '+c.cls+'">'+c.name+' • ~'+f.min+' min</span><ul>'+f.pts.map(function(p){ return '<li>'+p+'</li>'; }).join('')+'</ul></div>';
  html += '<div class="foot" style="margin-bottom:10px">Résumé établi à partir des règles du Code de la route. Vérifie toujours avec ton moniteur.</div>';
  html += '<div style="display:flex;flex-direction:column;gap:10px"><button class="btn green full" data-a="read" data-f="'+f.id+'">'+(store.read[f.id]?'Fiche déjà lue • Revenir aux cours':'J’ai lu cette fiche')+'</button><button class="btn ghost full" data-a="cat" data-c="'+c.id+'">S’entraîner sur ce thème</button></div></div>';
  return html;
}

function vPremium(){
  var html = '<div class="hero" style="height:170px;padding-top:50px">'+hills()+'<button class="back" data-a="backprem">'+BACK+' Retour</button><h1 style="font-size:26px;max-width:62%">Accès complet</h1>'+mascot('trophy','mascot')+'</div><div class="sheet">';
  if(isPrem()){
    html += '<div class="card"><div class="ctitle">Accès complet actif</div><div class="muted">Encore '+premDays()+' jour'+(premDays()>1?'s':'')+'. Bonne préparation !</div></div>';
    return html+'</div>';
  }
  html += '<div class="card"><div class="price">'+PRICE+' <small>pour 3 mois</small></div><ul class="perks"><li>Les '+Q.length+' questions, sur tous les thèmes</li><li>Examens blancs de 40 questions, avec correction</li><li>Les 10 fiches de cours</li><li>Suivi de tes progrès et de tes erreurs</li></ul>'+
    '<button class="btn green full" style="margin-top:10px" data-a="buy">Acheter l’accès complet</button>'+(payMsg&&payMsg.k==='ko'&&payMsg.t.indexOf('paiement')>=0?'<div class="msg ko" style="margin-top:10px">'+payMsg.t+'</div>':'')+'</div>';
  html += '<div class="card"><div class="ctitle">Tu as déjà un code ?</div><input id="code" class="inp" placeholder="CODE-XXXXXX" autocomplete="off" autocapitalize="characters" spellcheck="false">'+(payMsg&&payMsg.t.indexOf('paiement')<0?'<div class="msg '+payMsg.k+'">'+payMsg.t+'</div>':'')+'<button class="btn purple full" data-a="activate">Activer mon code</button></div>';
  html += '<div class="foot">Gratuit : '+Object.keys(FREE_IDS).length+' questions et 2 fiches. Questions d’entraînement originales, non officielles.</div></div>';
  return html;
}
function modeLabel(){ return run.mode==='exam'?'Examen blanc':run.mode==='errors'?'Mes erreurs':run.mode==='daily'?'Question du jour':catById(run.cat).name; }
function vQuiz(){
  var id = run.ids[run.i], q = Q[id], c = catOf(id), n = run.ids.length, exam = run.mode==='exam';
  var last = run.i===n-1;
  var html = '<div class="qwrap"><div class="qtop"><button class="x" data-a="close" aria-label="Quitter">×</button><div class="qbar"><i style="width:'+Math.round(100*(run.i+(run.done?1:0))/n)+'%"></i></div><span class="cnt">'+(run.i+1)+'/'+n+'</span></div>';
  html += '<div class="qcard"><span class="qtheme '+c.cls+'">'+icon(c)+' '+q.t+'</span><h2>'+q.q+'</h2></div><div class="opts">';
  run.opts.forEach(function(o,k){
    var cl = 'opt';
    if(run.done){ if(o.ok) cl+=' ok'; else if(k===run.sel) cl+=' ko'; else cl+=' dim'; }
    else if(k===run.sel) cl+=' sel';
    html += '<button class="'+cl+'" data-a="opt" data-k="'+k+'"><b>'+String.fromCharCode(65+k)+'</b><span>'+o.t+'</span></button>';
  });
  html += '</div>';
  if(run.done && !exam){
    var good = run.opts[run.sel].ok;
    html += '<div class="fb '+(good?'ok':'ko')+'"><b>'+(good?'Bonne réponse !':'Pas tout à fait')+'</b>'+q.e+'</div>';
  }
  var ready = exam ? run.sel!==null : run.done;
  html += '<button class="btn green full" data-a="next"'+(ready?'':' disabled')+'>'+(last?'Voir le résultat':(exam?'Valider et continuer':'Question suivante'))+'</button></div>';
  return html;
}

function vResult(){
  var n = run.results.length, good = run.results.filter(function(r){ return r.ok; }).length, errs = n-good, exam = run.mode==='exam';
  var verdict, bub;
  if(exam){
    var pass = errs<=5;
    verdict = pass ? 'Réussi : '+errs+' erreur'+(errs>1?'s':'')+' (5 maximum)' : 'Non réussi : '+errs+' erreurs (5 maximum)';
    bub = pass ? 'Bravo !' : 'Courage !';
  } else {
    verdict = errs ? errs+' erreur'+(errs>1?'s':'')+' à revoir' : 'Sans faute !';
    bub = errs ? 'Tu progresses !' : 'Parfait !';
  }
  var h = hero('<div class="lab">'+modeLabel()+'</div><div class="big">'+good+' / '+n+'</div><span class="chip">'+verdict+'</span>', good*2>=n?'trophy':'thumb', bub);
  var html = h+'<div class="sheet"><div style="display:flex;flex-direction:column;gap:10px;margin-bottom:14px"><button class="btn green full" data-a="again">Rejouer</button><button class="btn ghost full" data-a="home">Retour à l’accueil</button></div>';
  var wr = run.results.filter(function(r){ return !r.ok; });
  if(wr.length){
    html += '<div class="sec"><h2>À revoir</h2></div><div class="card" style="padding:6px 14px">';
    wr.forEach(function(r){
      var q = Q[r.id];
      html += '<div class="revi"><div class="qq">'+q.q+'</div><div class="you">Ta réponse : '+r.pick+'</div><div class="good">Bonne réponse : '+q.o[0]+'</div><div class="why">'+q.e+'</div></div>';
    });
    html += '</div>';
  }
  return html+'</div>';
}

function render(){
  var tabs = {home:vHome, series:vSeries, stats:vStats, cours:vCours};
  var html, withNav = false;
  if(tabs[screen]){ html = tabs[screen](); withNav = true; }
  else if(screen==='fiche') html = vFiche();
  else if(screen==='premium') html = vPremium();
  else if(screen==='quiz') html = vQuiz();
  else html = vResult();
  $app.className = 'app'+(withNav?'':' noNav');
  $app.innerHTML = html + (withNav?nav():'');
  if(screen!==lastScreen){ try{ window.scrollTo(0,0); }catch(e){} lastScreen = screen; }
}
function go(s){ screen = s; render(); }

/* ---------- quiz logic ---------- */
function buildOpts(id){ return shuffle(Q[id].o.map(function(t,k){ return {t:t, ok:k===0}; })); }
function startRun(mode, ids, cat, resume){
  if(!ids.length) return;
  run = {mode:mode, cat:cat||null, ids:ids, i:resume?resume.results.length:0, results:resume?resume.results.slice():[], sel:null, done:false};
  run.opts = buildOpts(run.ids[run.i]);
  go('quiz');
}
function record(id, ok, pick){
  store.ans[id] = {ok:ok, ts:Date.now()};
  store.log.push({id:id, ok:ok, ts:Date.now()});
  if(store.log.length>400) store.log = store.log.slice(-400);
  run.results.push({id:id, ok:ok, pick:pick});
}
function validate(){
  var id = run.ids[run.i], o = run.opts[run.sel];
  record(id, o.ok, o.t);
  run.done = true;
}
function finish(){
  if(run.mode==='serie'){ store.done.push(Date.now()); store.resume = null; }
  if(run.mode==='exam'){
    var g = run.results.filter(function(r){ return r.ok; }).length;
    if(store.best===null || g>store.best) store.best = g;
  }
  save(); go('result');
}
function nextQ(){
  if(run.i>=run.ids.length-1){ finish(); return; }
  run.i++; run.sel = null; run.done = false; run.opts = buildOpts(run.ids[run.i]);
  if(run.mode==='serie'){ store.resume = {cat:run.cat, ids:run.ids, results:run.results}; }
  save(); render();
}

$app.addEventListener('click', function(e){
  var b = e.target.closest ? e.target.closest('[data-a]') : null;
  if(!b || b.disabled) return;
  var a = b.getAttribute('data-a'), d = function(k){ return b.getAttribute('data-'+k); };
  if(a==='tab'){ go(d('t')); }
  else if(a==='cat'){ var c = catById(d('c')); startRun('serie', pickSeries(c), c.id); }
  else if(a==='exam'){ if(!isPrem()){ payMsg=null; go('premium'); return; } startRun('exam', shuffle(ALL).slice(0,Math.min(40,Q.length))); }
  else if(a==='daily'){ startRun('daily', [dayIdx()%Q.length]); }
  else if(a==='resume'){ var r = store.resume; if(r) startRun('serie', r.ids, r.cat, r); }
  else if(a==='errors'){
    var wr = ALL.filter(function(i){ return store.ans[i] && !store.ans[i].ok; });
    startRun('errors', shuffle(wr.length?wr:ALL).slice(0,10));
  }
  else if(a==='opt'){
    if(run.done) return;
    run.sel = parseInt(d('k'),10);
    if(run.mode!=='exam'){ validate(); }
    render();
  }
  else if(a==='next'){
    if(run.mode==='exam'){ if(run.sel===null) return; validate(); }
    nextQ();
  }
  else if(a==='close'){
    if(run.mode==='serie' && run.results.length && run.results.length<run.ids.length){
      store.resume = {cat:run.cat, ids:run.ids, results:run.results}; save();
    }
    go(run.mode==='serie'?'series':'home');
  }
  else if(a==='again'){
    if(run.mode==='exam' && isPrem()) startRun('exam', shuffle(ALL).slice(0,Math.min(40,Q.length)));
    else if(run.mode==='serie') startRun('serie', pickSeries(catById(run.cat)), run.cat);
    else go('home');
  }
  else if(a==='home'){ go('home'); }
  else if(a==='backprem'){ go('home'); }
  else if(a==='filter'){ coursCat = d('c') && coursCat!==d('c') ? d('c') : null; render(); }
  else if(a==='fiche'){ if(!isPrem() && !FREE_FICHES[d('f')]){ payMsg=null; go('premium'); return; } ficheId = d('f'); go('fiche'); }
  else if(a==='premium'){ payMsg=null; go('premium'); }
  else if(a==='buy'){ if(PAY_URL.indexOf('REMPLACER')>=0){ payMsg={k:'ko',t:'Le paiement en ligne sera disponible très bientôt.'}; render(); } else { try{ window.open(PAY_URL,'_blank','noopener'); }catch(e){} } }
  else if(a==='activate'){
    var inp = document.getElementById('code'), v = inp ? inp.value.toUpperCase().replace(/\s/g,'') : '';
    if(CODES.indexOf(cyrb53(v))>=0){ store.prem = Date.now(); save(); payMsg={k:'ok',t:'Accès complet activé pour 3 mois !'}; }
    else payMsg={k:'ko',t:'Code incorrect. Vérifie les majuscules et le tiret.'};
    render();
  }
  else if(a==='read'){ store.read[d('f')] = 1; save(); go('cours'); }
});

render();
</script>
</body>
