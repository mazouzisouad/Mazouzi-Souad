<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e293b">
  <title>Moto Planning</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="icon.svg" alt="" width="28" height="28">
      <span>Moto Planning</span>
    </div>
    <nav class="tabs" id="tabs">
      <button data-view="planning" class="active">📅 Planning</button>
      <button data-view="eleves">👤 Élèves</button>
      <button data-view="paiements">💶 Paiements</button>
      <button data-view="motos">🏍️ Motos</button>
      <button data-view="parametres">⚙️ Paramètres</button>
    </nav>
    <div id="user-chip" class="user-chip"></div>
  </header>

  <main id="view"></main>

  <div id="modal-root"></div>
  <div id="toast" class="toast" hidden></div>

  <script src="vendor/jspdf.umd.min.js"></script>
  <script src="vendor/firebase/firebase-app-compat.js"></script>
  <script src="vendor/firebase/firebase-auth-compat.js"></script>
  <script src="vendor/firebase/firebase-firestore-compat.js"></script>
  <script src="config.js"></script>
  <script src="cloud.js"></script>
  <script src="contrats.js"></script>
  <script src="rappels.js"></script>
  <script src="suivi.js"></script>
  <script src="email.js"></script>
  <script src="motos.js"></script>
  <script src="compte.js"></script>
  <script src="eleves-import.js"></script>
  <script src="pdfdesign.js"></script>
  <script src="app.js"></script>
</body>
</html>
